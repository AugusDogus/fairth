name: fairth

services:
  android:
    image: ${ANDROID_EMULATOR_IMAGE:-us-docker.pkg.dev/android-emulator-268719/images/29-google-x64-no-metrics:30.1.2}
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      ADBKEY: ${ADBKEY:?Set ADBKEY to the contents of an Android ADB private key}
      EMULATOR_PARAMS: ${EMULATOR_PARAMS:--no-window -no-audio -no-boot-anim -gpu swiftshader_indirect}
    ports:
      - 127.0.0.1:${ANDROID_ADB_PORT:-5555}:5555
      - 127.0.0.1:${ANDROID_GRPC_PORT:-8554}:8554
    restart: unless-stopped
    volumes:
      - ${ANDROID_DATA_PATH:-/mnt/user/appdata/fairth/android-data}:/data

  adb:
    build:
      context: .
      dockerfile: docker/adb/Containerfile
    command: ["sleep", "infinity"]
    depends_on:
      - android
    restart: unless-stopped
    volumes:
      - ${ANDROID_ADB_KEY_DIRECTORY:-/mnt/user/appdata/fairth/adb}:/root/.android
